services:
  chatbot-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: langgraph-rag-chatbot
    restart: unless-stopped
    ports:
      - "8501:8501"   # Streamlit UI
      - "8000:8000"   # MCP Server (SSE)
    env_file:
      - .env
    environment:
      - STREAMLIT_SERVER_PORT=8501
      - STREAMLIT_SERVER_ADDRESS=0.0.0.0
      - MCP_PORT=8000
      - MCP_HOST=0.0.0.0
      - ANONYMIZED_TELEMETRY=False
    volumes:
      # Persist SQLite databases and ChromaDB vectors across container restarts
      - chatbot_data:/app/chroma_db
      - chatbot_db:/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8501/_stcore/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

volumes:
  chatbot_data:
  chatbot_db:
